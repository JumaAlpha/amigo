<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Amijoji · Amigo Johnson — video director</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:opsz@14..32&family=Caveat:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="styles/main.css">

    <!-- Loading Screen Styles -->
    <style>
        /* Loading overlay – covers everything initially */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
            font-family: 'Inter', sans-serif;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Simple loading text with animated dots */
        .loading-text {
            color: #d4af37;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .dot-animation {
            display: inline-flex;
            gap: 4px;
        }

        .dot-animation span {
            animation: dotPulse 1.4s infinite ease-in-out;
            animation-fill-mode: both;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .dot-animation span:nth-child(1) {
            animation-delay: 0s;
        }
        .dot-animation span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dot-animation span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%, 60%, 100% {
                opacity: 0.2;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-6px);
            }
        }

        /* Initially hide main content until loading is done */
        .app, #fog-marquee-container, .site-logo {
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }

        .content-visible .app,
        .content-visible #fog-marquee-container,
        .content-visible .site-logo {
            opacity: 1;
        }

        /* Ensure the loading overlay sits on top */
        body {
            margin: 0;
            background: #000;
        }
    </style>
</head>

<body>
    <!-- Loading Screen Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-text">
            Loading
            <div class="dot-animation">
                <span>.</span><span>.</span><span>.</span>
            </div>
        </div>
    </div>

    <!-- Viewport height fix for mobile browsers -->
    <script>
        (function () {
            function setVH() {
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
                document.documentElement.style.setProperty('--full-vh', `${window.innerHeight}px`);
            }
            setVH();
            window.addEventListener('resize', setVH);
            window.addEventListener('orientationchange', function () { setTimeout(setVH, 100); });
            if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                window.addEventListener('load', setVH);
                window.addEventListener('pageshow', setVH);
                if (window.navigator.standalone) document.addEventListener('scroll', setVH);
            }
            if ('visualViewport' in window) {
                window.visualViewport.addEventListener('resize', function () {
                    if (window.visualViewport.height > window.innerHeight * 0.7) setVH();
                });
            }
        })();
    </script>

    <!-- Fog Overlay Container -->
    <div id="fog-marquee-container"></div>

    <!-- Handwriting Logo -->
    <div class="site-logo">
        <span class="amigo">Amigo</span>
        <span class="johnson">Johnson</span>
    </div>

    <!-- Main App Container -->
    <div class="app">
        <!-- sb Component -->
        <div id="sb-container"></div>

        <!-- Main Content with Horizontal Scroll -->
        <main class="main-content" id="main-content"></main>
    </div>

    <!-- Component Scripts -->
    <script src="components/sb.js"></script>
    <script src="components/hs.js"></script>
    <script src="components/wg.js"></script>
    <script src="components/rs.js"></script>
    <script src="components/bts.js"></script>
    <script src="components/ag.js"></script>
    <script src="components/av.js"></script>
    <script src="components/bf.js"></script>
    <script src="components/fm.js"></script>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Main Initialization Script + Loading Screen Monitor -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Helper to load CSS dynamically
            function loadComponentCSS(href) {
                return new Promise((resolve, reject) => {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = href;
                    link.onload = () => { console.log(`CSS loaded: ${href}`); resolve(); };
                    link.onerror = (error) => { console.error(`Error loading CSS: ${href}`, error); reject(error); };
                    document.head.appendChild(link);
                });
            }

            // All component CSS files
            const cssFiles = [
                'styles/sb.css',
                'styles/hero.css',
                'styles/wg.css',
                'styles/rs.css',
                'styles/bts.css',
                'styles/ag.css',
                'styles/av.css',
                'styles/bf.css',
                'styles/fm.css'
            ];

            Promise.all(cssFiles.map(loadComponentCSS))
                .then(() => {
                    // Check required components
                    if (typeof fm === 'undefined' || typeof sb === 'undefined') {
                        console.error('Missing required components');
                        return;
                    }

                    // Render fog and sb
                    const fogContainer = document.getElementById('fog-marquee-container');
                    if (fogContainer) fogContainer.innerHTML = fm.render();

                    const sbContainer = document.getElementById('sb-container');
                    if (sbContainer) sbContainer.innerHTML = sb.render();

                    // Render main content sections
                    const mainContent = document.getElementById('main-content');
                    if (mainContent) {
                        mainContent.innerHTML = `
                            ${hs.render()}
                            ${wg.render()}
                            ${rs.render()}
                            ${bts.render()}
                            ${ag.render()}
                            ${av.render()}
                            ${bf.render()}
                        `;
                    }

                    // Initialize all components except bts's loading will be monitored separately
                    if (typeof fm.init === 'function') fm.init();
                    if (typeof sb.init === 'function') sb.init();
                    if (typeof hs.init === 'function') hs.init();
                    if (typeof wg.init === 'function') wg.init();
                    if (typeof rs.init === 'function') rs.init();
                    if (typeof ag.init === 'function') ag.init();
                    if (typeof av.init === 'function') av.init();
                    if (typeof bf.init === 'function') bf.init();

                    if (typeof AOS !== 'undefined') {
                        AOS.init({
                            duration: 700,
                            easing: 'ease-out-cubic',
                            once: false,
                            mirror: true,
                            offset: 80,
                            anchorPlacement: 'top-center'
                        });
                    }

                    // Initialize bts – this will start loading videos
                    if (typeof bts.init === 'function') {
                        bts.init();
                    }

                    // ---- Loading Screen Monitor for BTS Videos ----
                    // Wait a short moment for bts to render DOM elements
                    setTimeout(() => {
                        // Gather all unique video URLs from the BTS slider items
                        const videoItems = document.querySelectorAll('.bts-custom-item');
                        const uniqueUrls = new Map(); // url -> { loaded: bool, videoElement: element }

                        for (let item of videoItems) {
                            const url = item.dataset.videoSrc;
                            if (url && !uniqueUrls.has(url)) {
                                const videoElem = item.querySelector('.bts-custom-video');
                                if (videoElem) {
                                    uniqueUrls.set(url, {
                                        loaded: false,
                                        videoElement: videoElem,
                                        readyState: videoElem.readyState
                                    });
                                }
                            }
                        }

                        const totalUnique = uniqueUrls.size;
                        if (totalUnique === 0) {
                            console.warn('No unique videos found – hiding loading screen immediately');
                            document.getElementById('loading-overlay')?.classList.add('hidden');
                            document.body.classList.add('content-visible');
                            return;
                        }

                        let loadedCount = 0;
                        const overlay = document.getElementById('loading-overlay');

                        function updateProgress() {
                            // Threshold = 30%
                            if (loadedCount / totalUnique >= 0.3) {
                                if (overlay) overlay.classList.add('hidden');
                                document.body.classList.add('content-visible');
                                // Clean up event listeners to avoid memory leaks
                                for (let [url, data] of uniqueUrls.entries()) {
                                    if (data.videoElement && data._canPlayHandler) {
                                        data.videoElement.removeEventListener('canplay', data._canPlayHandler);
                                    }
                                }
                            }
                        }

                        // For each video, listen for 'canplay' event (enough data to play first few seconds)
                        for (let [url, data] of uniqueUrls.entries()) {
                            const video = data.videoElement;
                            if (!video) continue;

                            // If already ready enough, count it immediately
                            if (video.readyState >= 2) {
                                if (!data.loaded) {
                                    data.loaded = true;
                                    loadedCount++;
                                    updateProgress();
                                }
                            }

                            // Add event listener for future readiness
                            const handler = () => {
                                if (!data.loaded && video.readyState >= 2) {
                                    data.loaded = true;
                                    loadedCount++;
                                    updateProgress();
                                }
                            };
                            video.addEventListener('canplay', handler);
                            data._canPlayHandler = handler;
                        }

                        // Fallback timeout: force hide loading screen after 10 seconds even if not 30% loaded
                        setTimeout(() => {
                            if (overlay && !overlay.classList.contains('hidden')) {
                                console.warn('Loading timeout (10s) – forcing content visible');
                                overlay.classList.add('hidden');
                                document.body.classList.add('content-visible');
                            }
                        }, 10000);

                        // Also if bts fails to load any video, ensure content shows eventually
                        setTimeout(() => {
                            if (loadedCount === 0 && totalUnique > 0) {
                                console.warn('No videos loaded after 5 seconds – forcing content visible');
                                if (overlay && !overlay.classList.contains('hidden')) {
                                    overlay.classList.add('hidden');
                                    document.body.classList.add('content-visible');
                                }
                            }
                        }, 5000);

                    }, 500); // slight delay to ensure DOM is ready
                })
                .catch(error => {
                    console.error('Error loading component CSS:', error);
                    // Fallback: show content anyway
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.classList.add('hidden');
                    document.body.classList.add('content-visible');
                });

            setTimeout(() => {
                const img = new Image();
                img.onerror = () => console.warn('⚠️ Fog image not found');
                img.src = 'assets/images/fog2.ecb15114.webp';
            }, 1000);
        });
    </script>
</body>

</html>
